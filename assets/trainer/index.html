<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roux Bridge Trainer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #181c23;
        --panel: #222832;
        --line: #303846;
        --text: #f1f3f6;
        --muted: #b9bfcc;
        --accent: #9a6335;
        --accent-strong: #bc7a3d;
        --blue: #0b47b7;
        --red: #d53113;
        --orange: #e88400;
        --white: #f4f4f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr) 320px;
        gap: 14px;
        min-height: 100vh;
        padding: 14px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .sidebar,
      .practice {
        padding: 14px;
      }

      .sidebar h1,
      .practice h2 {
        margin: 0 0 12px;
        font-size: 18px;
        letter-spacing: 0;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-bottom: 12px;
      }

      .tab,
      .case,
      .control,
      .submit {
        border: 0;
        border-radius: 6px;
        color: var(--text);
        background: #303846;
        cursor: pointer;
      }

      .tab {
        min-height: 36px;
      }

      .tab.active,
      .submit {
        background: var(--accent);
      }

      .case-list {
        display: grid;
        gap: 8px;
      }

      .case {
        padding: 10px;
        text-align: left;
      }

      .case.active {
        outline: 2px solid var(--accent-strong);
      }

      .case-title {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-weight: 700;
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 8px;
      }

      .tag {
        border-radius: 999px;
        padding: 2px 7px;
        background: #171b22;
        color: var(--muted);
        font-size: 12px;
      }

      .stage {
        display: grid;
        grid-template-rows: auto minmax(340px, 1fr) auto auto;
        gap: 12px;
        min-width: 0;
      }

      .alg-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px;
        align-items: center;
      }

      .move {
        min-width: 52px;
        padding: 7px 10px;
        border-radius: 4px;
        background: var(--accent);
        color: #120b06;
        font-size: clamp(24px, 5vw, 44px);
        line-height: 1;
        text-align: center;
      }

      .cube-zone {
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
        min-height: 340px;
      }

      .cube-scene {
        width: min(58vw, 360px);
        height: min(58vw, 360px);
        min-width: 240px;
        min-height: 240px;
        perspective: 780px;
      }

      .cube {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transform: rotateX(-28deg) rotateY(42deg);
      }

      .face {
        position: absolute;
        inset: 15%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 3px;
        padding: 3px;
        border: 3px solid rgba(0, 0, 0, 0.72);
        background: rgba(10, 12, 16, 0.8);
      }

      .front {
        transform: translateZ(126px);
      }

      .right {
        transform: rotateY(90deg) translateZ(126px);
      }

      .top {
        transform: rotateX(90deg) translateZ(126px);
      }

      .sticker {
        border: 1px solid rgba(0, 0, 0, 0.7);
        background: rgba(20, 24, 31, 0.6);
      }

      .blue {
        background: var(--blue);
      }

      .red {
        background: var(--red);
      }

      .orange {
        background: var(--orange);
      }

      .white {
        background: var(--white);
      }

      .hint {
        position: absolute;
        left: 16px;
        bottom: 16px;
        color: var(--muted);
        font-size: 14px;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(5, minmax(52px, 1fr));
        gap: 10px;
        padding: 12px;
      }

      .control {
        min-height: 48px;
        font-size: 22px;
      }

      .step-note {
        padding: 0 12px 14px;
        color: var(--muted);
      }

      .step-note code {
        display: inline-block;
        margin-right: 8px;
        padding: 4px 8px;
        border-radius: 4px;
        background: #30343c;
        color: var(--text);
      }

      .practice {
        display: grid;
        align-content: start;
        gap: 12px;
      }

      .meta {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      .practice input {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 10px;
        background: #151920;
        color: var(--text);
      }

      .submit {
        min-height: 44px;
      }

      .feedback {
        min-height: 44px;
        color: var(--muted);
      }

      a {
        color: #f1b77b;
      }

      @media (max-width: 920px) {
        .app {
          grid-template-columns: 1fr;
        }

        .stage {
          grid-template-rows: auto 360px auto auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="panel sidebar">
        <h1>Roux examples</h1>
        <div class="tabs" role="tablist">
          <button class="tab active" data-filter="ALL">All</button>
          <button class="tab" data-filter="FB">FB</button>
          <button class="tab" data-filter="SB">SB</button>
        </div>
        <div class="case-list" id="caseList"></div>
      </aside>

      <section class="panel stage">
        <div class="alg-strip" id="algStrip"></div>
        <div class="cube-zone">
          <div class="cube-scene" aria-label="3D cube training view">
            <div class="cube" id="cube">
              <div class="face front" id="frontFace"></div>
              <div class="face right" id="rightFace"></div>
              <div class="face top" id="topFace"></div>
            </div>
          </div>
          <div class="hint" id="goalHint"></div>
        </div>
        <div class="controls">
          <button class="control" id="firstBtn" aria-label="First step">|&lt;</button>
          <button class="control" id="prevBtn" aria-label="Previous step">&lt;</button>
          <button class="control" id="playBtn" aria-label="Play steps">▶</button>
          <button class="control" id="nextBtn" aria-label="Next step">&gt;</button>
          <button class="control" id="lastBtn" aria-label="Last step">&gt;|</button>
        </div>
        <div class="step-note" id="stepNote"></div>
      </section>

      <aside class="panel practice">
        <h2 id="caseTitle"></h2>
        <div class="meta">
          <div><strong>Scramble:</strong> <span id="scramble"></span></div>
          <div><strong>Target:</strong> <span id="target"></span></div>
          <div><strong>Reference:</strong> <a id="source" href="#"></a></div>
        </div>
        <label for="answer">Try your solution</label>
        <input id="answer" autocomplete="off" placeholder="Example: U R U' R'" />
        <button class="submit" id="checkBtn">Check exact reference</button>
        <div class="feedback" id="feedback"></div>
      </aside>
    </main>

    <script>
      const cases = [
        {
          id: "fb-square-pair",
          phase: "FB",
          title: "DL first square + pair",
          goal: "Build the left 1x2x3 first block",
          scramble: "R U R' F2 U2 r U r'",
          solution: "U2 r U' r' U R U' R'",
          tags: ["DL first", "square+pair"],
          source: ["Rouxers first block", "https://tutorial.rouxers.com/intermediate/first-block.html"],
          steps: [
            { alg: "U2 r U' r'", note: "Make the square around the left block base." },
            { alg: "U R U' R'", note: "Attach and insert the final pair." }
          ]
        },
        {
          id: "fb-line-line",
          phase: "FB",
          title: "Line-line first block",
          goal: "Solve two lines, then join them into FB",
          scramble: "U R2 F R U' r U M'",
          solution: "r U M' U' R U R'",
          tags: ["line-line", "FB"],
          source: ["Rouxers first block", "https://tutorial.rouxers.com/intermediate/first-block.html"],
          steps: [
            { alg: "r U M'", note: "Form the left-side line without locking the top layer." },
            { alg: "U' R U R'", note: "Join the matching line into the first block." }
          ]
        },
        {
          id: "sb-dr-first",
          phase: "SB",
          title: "DR first second block",
          goal: "Build the right 1x2x3 block while preserving FB",
          scramble: "M U R U' r' U2 R U R'",
          solution: "R U R' U r U' r'",
          tags: ["DR first", "<R,r,U,M>"],
          source: ["Rouxers second block", "https://tutorial.rouxers.com/intermediate/second-block.html"],
          steps: [
            { alg: "R U R'", note: "Place the DR edge and keep the first block untouched." },
            { alg: "U r U' r'", note: "Insert the second-block pair with wide moves." }
          ]
        },
        {
          id: "sb-wide-insert",
          phase: "SB",
          title: "Wide insert second block",
          goal: "Use r and M-friendly insertions for SB",
          scramble: "U2 r U r' U R U2 R'",
          solution: "U r U' r' U' R U R'",
          tags: ["wide insert", "SB"],
          source: ["CubeRoot Roux", "https://www.cuberoot.me/roux/"],
          steps: [
            { alg: "U r U' r'", note: "Pair and position the right block pieces." },
            { alg: "U' R U R'", note: "Finish the right block with a compact insertion." }
          ]
        }
      ];

      let filter = "ALL";
      let activeCaseIndex = 0;
      let activeStepIndex = 0;
      let timer = null;

      const normalizeAlg = (alg) =>
        alg
          .trim()
          .replace(/\s+/g, " ")
          .replace(/\(\s+/g, "(")
          .replace(/\s+\)/g, ")");

      const filteredCases = () =>
        filter === "ALL" ? cases : cases.filter((item) => item.phase === filter);

      const activeCase = () => filteredCases()[activeCaseIndex] ?? filteredCases()[0];

      const renderFace = (target, palette) => {
        target.innerHTML = "";
        for (let i = 0; i < 9; i += 1) {
          const sticker = document.createElement("div");
          sticker.className = `sticker ${palette[i] ?? ""}`;
          target.appendChild(sticker);
        }
      };

      const renderCube = (item) => {
        const fb = item.phase === "FB";
        renderFace(
          document.querySelector("#frontFace"),
          fb
            ? ["blue", "blue", "", "blue", "blue", "", "blue", "white", ""]
            : ["", "blue", "blue", "", "blue", "blue", "", "red", "blue"]
        );
        renderFace(
          document.querySelector("#rightFace"),
          fb
            ? ["", "", "red", "", "", "red", "", "", "red"]
            : ["white", "white", "red", "blue", "blue", "red", "", "red", "red"]
        );
        renderFace(
          document.querySelector("#topFace"),
          fb
            ? ["orange", "orange", "", "orange", "", "white", "", "", ""]
            : ["", "white", "white", "orange", "", "white", "", "", ""]
        );
      };

      const playbackAlg = (item) =>
        item.steps
          .slice(0, activeStepIndex + 1)
          .map((step) => step.alg)
          .join(" ");

      const render = () => {
        const list = filteredCases();
        const item = activeCase();
        document.querySelectorAll(".tab").forEach((tab) => {
          tab.classList.toggle("active", tab.dataset.filter === filter);
        });
        document.querySelector("#caseList").innerHTML = list
          .map(
            (entry, index) => `
              <button class="case ${index === activeCaseIndex ? "active" : ""}" data-case-index="${index}">
                <span class="case-title"><span>${entry.title}</span><span>${entry.phase}</span></span>
                <span class="tag-row">${entry.tags.map((tag) => `<span class="tag">${tag}</span>`).join("")}</span>
              </button>
            `
          )
          .join("");
        document.querySelectorAll(".case").forEach((button) => {
          button.addEventListener("click", () => {
            activeCaseIndex = Number(button.dataset.caseIndex);
            activeStepIndex = 0;
            stopPlayback();
            render();
          });
        });
        document.querySelector("#algStrip").innerHTML = playbackAlg(item)
          .split(" ")
          .filter(Boolean)
          .map((move) => `<span class="move">${move}</span>`)
          .join("");
        document.querySelector("#stepNote").innerHTML =
          `<code>${item.steps[activeStepIndex].alg}</code>${item.steps[activeStepIndex].note}`;
        document.querySelector("#goalHint").textContent = item.goal;
        document.querySelector("#caseTitle").textContent = item.title;
        document.querySelector("#scramble").textContent = item.scramble;
        document.querySelector("#target").textContent = item.goal;
        document.querySelector("#source").textContent = item.source[0];
        document.querySelector("#source").href = item.source[1];
        renderCube(item);
      };

      const stopPlayback = () => {
        if (timer) {
          clearInterval(timer);
          timer = null;
          document.querySelector("#playBtn").textContent = "▶";
        }
      };

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          filter = tab.dataset.filter;
          activeCaseIndex = 0;
          activeStepIndex = 0;
          stopPlayback();
          render();
        });
      });

      document.querySelector("#firstBtn").addEventListener("click", () => {
        activeStepIndex = 0;
        stopPlayback();
        render();
      });

      document.querySelector("#prevBtn").addEventListener("click", () => {
        activeStepIndex = Math.max(0, activeStepIndex - 1);
        stopPlayback();
        render();
      });

      document.querySelector("#nextBtn").addEventListener("click", () => {
        const item = activeCase();
        activeStepIndex = Math.min(item.steps.length - 1, activeStepIndex + 1);
        stopPlayback();
        render();
      });

      document.querySelector("#lastBtn").addEventListener("click", () => {
        activeStepIndex = activeCase().steps.length - 1;
        stopPlayback();
        render();
      });

      document.querySelector("#playBtn").addEventListener("click", () => {
        if (timer) {
          stopPlayback();
          return;
        }
        document.querySelector("#playBtn").textContent = "Ⅱ";
        timer = setInterval(() => {
          const item = activeCase();
          if (activeStepIndex >= item.steps.length - 1) {
            stopPlayback();
            return;
          }
          activeStepIndex += 1;
          render();
        }, 1100);
      });

      document.querySelector("#checkBtn").addEventListener("click", () => {
        const item = activeCase();
        const answer = normalizeAlg(document.querySelector("#answer").value);
        const reference = normalizeAlg(item.solution);
        const feedback = document.querySelector("#feedback");
        if (!answer) {
          feedback.textContent = "Enter your solution first.";
        } else if (answer === reference) {
          feedback.textContent = "Matches the reference solution.";
        } else {
          feedback.textContent = `Reference: ${reference}`;
        }
      });

      render();
    </script>
  </body>
</html>
